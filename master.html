<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التحكم الرئيسي</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  :root{
    --night:#12151c; --night-2:#1b202b;
    --chalk:#f4f1e6; --accent:#5a8fd6; --danger:#d9564a; --good:#5a9c5c; --warn:#e8b93a;
    --line: rgba(244,241,230,0.12);
  }
  body{ background:var(--night); color:var(--chalk); font-family:'Cairo', sans-serif; min-height:100vh; }
  .wrap{ max-width:460px; margin:0 auto; padding:24px 18px 60px; }
  h1{ font-family:'Almarai'; font-weight:800; font-size:22px; text-align:center; margin-bottom:6px; }
  .sub{ text-align:center; font-size:13px; color:rgba(244,241,230,0.5); margin-bottom:28px; }
  .card{ background:var(--night-2); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:13px; margin-bottom:6px; color:rgba(244,241,230,0.7); }
  .field input{ width:100%; background:rgba(244,241,230,0.06); border:1px solid var(--line); border-radius:9px; padding:12px; color:var(--chalk); font-family:'Cairo'; font-size:15px; }
  .field input:focus{ outline:none; border-color:var(--accent); }
  .btn{ width:100%; border:none; border-radius:10px; padding:13px; font-family:'Cairo'; font-weight:700; font-size:14px; cursor:pointer; margin-bottom:10px; }
  .btn.primary{ background:var(--accent); color:#fff; }
  .btn.good{ background:var(--good); color:#fff; }
  .btn.danger{ background:var(--danger); color:#fff; }
  .btn.ghost{ background:none; border:1px solid var(--line); color:rgba(244,241,230,0.7); }
  .err{ color:var(--danger); font-size:12.5px; margin-top:-6px; margin-bottom:10px; display:none; }
  .status-circle{ width:110px; height:110px; border-radius:50%; margin:0 auto 16px; display:flex; align-items:center; justify-content:center; font-size:40px; font-weight:800; font-family:'Cairo'; color:#fff; }
  .status-row{ display:flex; justify-content:space-between; font-size:13.5px; padding:6px 0; border-bottom:1px solid var(--line); }
  .status-row:last-child{ border-bottom:none; }
  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--night-2); color:var(--chalk); padding:12px 18px; border-radius:10px; font-size:13.5px; opacity:0; pointer-events:none; transition:opacity .3s; z-index:100; border:1px solid var(--line); }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAATE8FjT-Pg2G1lqNlqDEajdqiZY1EGdk",
  authDomain: "malaeb-shaabiya.firebaseapp.com",
  projectId: "malaeb-shaabiya",
  storageBucket: "malaeb-shaabiya.firebasestorage.app",
  messagingSenderId: "186784756749",
  appId: "1:186784756749:web:c382ebd1dccc8a26b85144"
};
firebase.initializeApp(firebaseConfig);
const _db = firebase.firestore();
const _COLLECTION = 'app_data';

async function getJson(key){
  try{ const doc = await _db.collection(_COLLECTION).doc(key).get(); return doc.exists ? JSON.parse(doc.data().value) : null; }
  catch(e){ return null; }
}
async function setJson(key, val){
  try{ await _db.collection(_COLLECTION).doc(key).set({ value: JSON.stringify(val), updatedAt: Date.now() }); return true; }
  catch(e){ return false; }
}

// غيّر هذه الكلمة لكلمة سر خاصة فيك أنت فقط — هذا التطبيق يتحكم بكل شي
const ahmed2004eng = 'غيّر_هذه_الكلمة';

let state = { loggedIn:false };
const toastEl = document.getElementById('toast');
function showToast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'), 2600); }

function localDateStr(d){
  d = d || new Date();
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function daysSinceDate(dateStr){
  const parts = dateStr.split('-').map(Number);
  const then = new Date(parts[0], parts[1]-1, parts[2]);
  const now = new Date();
  const nowMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.floor((nowMidnight - then) / 86400000);
}
async function getLicense(){
  const lic = await getJson('license:info');
  if(!lic) return { adminCode:'admin2026', renewedDate: localDateStr(), active:true, daysLeft:30 };
  const daysElapsed = daysSinceDate(lic.renewedDate);
  const daysLeft = lic.active===false ? 0 : Math.max(0, 30 - daysElapsed);
  return { ...lic, daysLeft };
}

function render(){
  const app = document.getElementById('app');
  if(!state.loggedIn){
    app.innerHTML = `
      <h1>التحكم الرئيسي</h1>
      <div class="sub">إدارة اشتراك لوحة المشرف</div>
      <div class="card">
        <div class="field"><label>كلمة السر الرئيسية</label><input type="password" id="masterPass" placeholder="********"></div>
        <div class="err" id="loginErr">كلمة السر غير صحيحة</div>
        <button class="btn primary" onclick="doLogin()">دخول</button>
      </div>`;
    return;
  }
  app.innerHTML = `
    <h1>التحكم الرئيسي</h1>
    <div class="sub">إدارة اشتراك لوحة المشرف</div>
    <div class="card"><div id="statusBox">جاري التحميل...</div></div>
    <div class="card">
      <div class="field"><label>رمز دخول لوحة المشرف الجديد</label><input type="text" id="newCode" placeholder="اكتب رمز جديد"></div>
      <button class="btn primary" onclick="changeCode()">حفظ الرمز الجديد</button>
    </div>
    <div class="card">
      <button class="btn good" onclick="renewSubscription()">تجديد الاشتراك (30 يومًا كاملة)</button>
      <button class="btn ghost" onclick="reactivateOnly()">تفعيل بدون تصفير العداد</button>
      <button class="btn danger" onclick="stopNow()">إيقاف اللوحة فورًا</button>
    </div>
    <button class="btn ghost" onclick="doLogout()">خروج</button>`;
  refreshStatus();
}

async function refreshStatus(){
  const lic = await getLicense();
  const box = document.getElementById('statusBox');
  if(!box) return;
  const color = lic.active===false ? '#3d1512' : (lic.daysLeft>15 ? '#1c3d1d' : (lic.daysLeft>5 ? '#4a3a0e' : '#3d1512'));
  const ringColor = lic.active===false ? '#d9564a' : (lic.daysLeft>15 ? '#5a9c5c' : (lic.daysLeft>5 ? '#e8b93a' : '#d9564a'));
  box.innerHTML = `
    <div class="status-circle" style="background:radial-gradient(circle at 35% 30%, ${ringColor}, ${color} 75%);">${lic.active===false?'0':lic.daysLeft}</div>
    <div class="status-row"><span>الحالة</span><b>${lic.active===false ? 'موقوفة' : (lic.daysLeft<=0 ? 'منتهية' : 'نشطة')}</b></div>
    <div class="status-row"><span>الأيام المتبقية</span><b>${lic.active===false ? 0 : lic.daysLeft} من 30</b></div>
    <div class="status-row"><span>رمز الدخول الحالي</span><b style="direction:ltr;">${lic.adminCode}</b></div>`;
}

function doLogin(){
  const pass = document.getElementById('masterPass').value;
  const errEl = document.getElementById('loginErr');
  if(pass !== MASTER_PASSWORD){ errEl.style.display='block'; return; }
  errEl.style.display = 'none';
  state.loggedIn = true;
  render();
}
function doLogout(){ state.loggedIn = false; render(); }

async function changeCode(){
  const newCode = document.getElementById('newCode').value.trim();
  if(!newCode){ showToast('اكتب رمزًا صحيحًا'); return; }
  const lic = await getLicense();
  await setJson('license:info', { adminCode:newCode, renewedDate: lic.renewedDate, active: lic.active!==false });
  showToast('تم تغيير رمز لوحة المشرف ✓');
  render();
}

async function renewSubscription(){
  const lic = await getLicense();
  await setJson('license:info', { adminCode: lic.adminCode, renewedDate: localDateStr(), active: true });
  showToast('تم تجديد الاشتراك لـ 30 يومًا ✓');
  render();
}

async function reactivateOnly(){
  const lic = await getLicense();
  await setJson('license:info', { adminCode: lic.adminCode, renewedDate: lic.renewedDate, active: true });
  showToast('تم تفعيل اللوحة (بدون تصفير العداد)');
  render();
}

async function stopNow(){
  const lic = await getLicense();
  await setJson('license:info', { adminCode: lic.adminCode, renewedDate: lic.renewedDate, active: false });
  showToast('تم إيقاف لوحة المشرف فورًا');
  render();
}

render();
</script>
</body>
</html>
